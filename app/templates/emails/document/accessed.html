<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h2 { color: #2c3e50; }
        .info-box { background-color: #f8f9fa; padding: 15px; border-left: 4px solid #17a2b8; margin: 15px 0; }
        .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Document viewed: {{ document_name }}</h2>
        <p>Hello {{ owner_name }},</p>
        <div class="info-box">
            <p><strong>{{ accessed_by_name }}</strong> viewed your shared document <strong>{{ document_name }}</strong>.</p>
            <p><strong>Accessed at:</strong> {{ accessed_at }}</p>
        </div>
        <div class="footer">
            <p>HexShare Document Management</p>
        </div>
    </div>
</body>
</html>
