x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-app-image: &app-image
  build: *app-build
  image: hexshare-backend:${HEXSHARE_IMAGE_TAG:-latest}

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  HEXIAM_URL: ${HEXIAM_URL}
  HEXIAM_PDP_URL: ${HEXIAM_PDP_URL}
  HEXIAM_JWT_SECRET: ${HEXIAM_JWT_SECRET}
  HEXIAM_JWKS_URL: ${HEXIAM_JWKS_URL}
  HEXSHARE_CLIENT_ID: ${HEXSHARE_CLIENT_ID}
  HEXSHARE_CLIENT_SECRET: ${HEXSHARE_CLIENT_SECRET}
  HEXSHARE_PDP_CLIENT_ID: ${HEXSHARE_PDP_CLIENT_ID}
  HEXSHARE_PDP_CLIENT_SECRET: ${HEXSHARE_PDP_CLIENT_SECRET}
  HEXSHARE_STORAGE: ${HEXSHARE_STORAGE:-postgres}
  HEXSHARE_IAM_POLICY: ${HEXSHARE_IAM_POLICY:-hexiam}
  HEXSHARE_OBJECT_STORAGE: ${HEXSHARE_OBJECT_STORAGE:-s3}
  HEXSHARE_OBJECT_BUCKET: ${HEXSHARE_OBJECT_BUCKET}
  HEXSHARE_OBJECT_PREFIX: ${HEXSHARE_OBJECT_PREFIX:-documents}
  HEXSHARE_VIEWER_STRATEGY: ${HEXSHARE_VIEWER_STRATEGY:-secure_streaming}
  HEXSHARE_DOCUMENT_PROCESSING_ENABLED: ${HEXSHARE_DOCUMENT_PROCESSING_ENABLED:-true}
  HEXSHARE_RENDERED_PAGE_CACHE: ${HEXSHARE_RENDERED_PAGE_CACHE:-redis}
  HEXSHARE_RENDERED_PAGE_CACHE_TTL: ${HEXSHARE_RENDERED_PAGE_CACHE_TTL:-120}
  HEXSHARE_RENDERED_PAGE_CACHE_PREFIX: ${HEXSHARE_RENDERED_PAGE_CACHE_PREFIX:-hexshare:rendered-page:}
  HEXSHARE_TASK_QUEUE: ${HEXSHARE_TASK_QUEUE:-arq}
  HEXSHARE_ARQ_MAX_JOBS: ${HEXSHARE_ARQ_MAX_JOBS:-4}
  HEXSHARE_ARQ_JOB_TIMEOUT_SECONDS: ${HEXSHARE_ARQ_JOB_TIMEOUT_SECONDS:-300}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  HEXSHARE_ACCESS_CONTROL: ${HEXSHARE_ACCESS_CONTROL:-hybrid}
  HEXSHARE_AUTHENTICATOR: ${HEXSHARE_AUTHENTICATOR:-hexiam}
  HEXSHARE_DEFAULT_OIDC_IDP: ${HEXSHARE_DEFAULT_OIDC_IDP:-hexiam}
  HEXSHARE_LOCAL_TENANT_ID: ${HEXSHARE_LOCAL_TENANT_ID:-local}
  HEXSHARE_AUTH_AUDIENCE: ${HEXSHARE_AUTH_AUDIENCE:-hexshare}
  HEXSHARE_LOCAL_ACCESS_TTL_SECONDS: ${HEXSHARE_LOCAL_ACCESS_TTL_SECONDS:-900}
  HEXSHARE_LOCAL_REFRESH_TTL_SECONDS: ${HEXSHARE_LOCAL_REFRESH_TTL_SECONDS:-2592000}
  HEXSHARE_POLICY_EVAL: ${HEXSHARE_POLICY_EVAL}
  HEXSHARE_EVENT_BUS: ${HEXSHARE_EVENT_BUS}
  HEXSHARE_JWT_SECRET: ${HEXSHARE_JWT_SECRET}
  HEXSHARE_SESSION_SECRET: ${HEXSHARE_SESSION_SECRET}
  HEXSHARE_API_WORKERS: ${HEXSHARE_API_WORKERS:-2}
  HEXSHARE_PUBLIC_URL: ${HEXSHARE_PUBLIC_URL}
  HEXSHARE_FRONTEND_URL: ${HEXSHARE_FRONTEND_URL}
  GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID}
  GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET}
  GOOGLE_OIDC_AUTHORIZE_URL: ${GOOGLE_OIDC_AUTHORIZE_URL:-https://accounts.google.com/o/oauth2/v2/auth}
  GOOGLE_OIDC_TOKEN_URL: ${GOOGLE_OIDC_TOKEN_URL:-https://oauth2.googleapis.com/token}
  GOOGLE_OIDC_USERINFO_URL: ${GOOGLE_OIDC_USERINFO_URL:-https://openidconnect.googleapis.com/v1/userinfo}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

services:
  hexshare-migrate:
    <<: *app-image
    restart: "no"
    environment: *backend-env
    command: ["python", "-m", "run_migrations", "apply"]
    depends_on:
      db:
        condition: service_healthy

  hexshare:
    <<: *app-image
    init: true
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "${HEXSHARE_API_PORT:-8099}:8000"
    expose:
      - "8000"
    depends_on:
      hexshare-migrate:
        condition: service_completed_successfully
      minio-create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  hexshare-worker:
    <<: *app-image
    init: true
    restart: unless-stopped
    environment: *backend-env
    command: ["arq", "app.workers.prerender_worker.WorkerSettings"]
    depends_on:
      hexshare-migrate:
        condition: service_completed_successfully
      minio-create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  hexshare-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    image: hexshare-frontend:${HEXSHARE_FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HEXSHARE_FRONTEND_PORT:-3000}:80"
    depends_on:
      hexshare:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until /usr/bin/mc alias set local http://minio:9000 "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"; do
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing "local/${HEXSHARE_OBJECT_BUCKET}"

volumes:
  postgres_data:
  redis_data:
  minio_data:
