[tool.poetry]
name = "hexshare"
version = "0.1.0"
description = ""
authors = ["Merrick1307 <holuworley.yz@gmail.com>"]
readme = ""

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.129.0"
fastapi-mail = "^1.6.2"
pyjwt = "^2.11.0"
asyncpg = "^0.31.0"
python-multipart = "^0.0.22"
httpx = {extras = ["standard"], version = "^0.28.1"}
user-agents = "^2.2.0"
uvicorn = {extras = ["standard"], version = "^0.41.0"}
yoyo-migrations = "^9.0.0"
boto3 = "^1.42.73"
cloudinary = "^1.44.1"
psycopg2-binary = "^2.9.11"
pdf-oxide = "^0.3.49"
pillow = "^12.2.0"
arq = "^0.28.0"


[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.1.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
