<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h2 { color: #2c3e50; }
        .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>New NDA Created: {{ title }}</h2>
        <p>A new NDA has been created by <strong>{{ created_by }}</strong>.</p>
        <p><strong>NDA ID:</strong> {{ nda_id }}</p>
        <p>Please review and take any necessary action.</p>
        <div class="footer">
            <p>HexShare Document Management</p>
        </div>
    </div>
</body>
</html>
