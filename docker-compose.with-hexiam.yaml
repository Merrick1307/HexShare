services:
  hexshare:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HEXIAM_URL: ${HEXIAM_PUBLIC_URL:-http://localhost:${HEXIAM_API_PORT:-8000}}
      HEXIAM_PDP_URL: ${HEXIAM_INTERNAL_URL:-http://hexiam:8000}
      HEXSHARE_AUTHENTICATOR: ${HEXSHARE_AUTHENTICATOR:-hexiam}
      HEXSHARE_DEFAULT_OIDC_IDP: ${HEXSHARE_DEFAULT_OIDC_IDP:-hexiam}
      HEXSHARE_IAM_POLICY: ${HEXSHARE_IAM_POLICY:-hexiam}
      HEXSHARE_SHARE_TOKEN_REVOCATION_STORE: ${HEXSHARE_SHARE_TOKEN_REVOCATION_STORE:-redis}
    depends_on:
      hexiam:
        condition: service_healthy

  hexshare-worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HEXIAM_URL: ${HEXIAM_PUBLIC_URL:-http://localhost:${HEXIAM_API_PORT:-8000}}
      HEXIAM_PDP_URL: ${HEXIAM_INTERNAL_URL:-http://hexiam:8000}
      HEXSHARE_SHARE_TOKEN_REVOCATION_STORE: ${HEXSHARE_SHARE_TOKEN_REVOCATION_STORE:-redis}
    depends_on:
      hexiam:
        condition: service_healthy

  hexshare-migrate:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HEXIAM_URL: ${HEXIAM_PUBLIC_URL:-http://localhost:${HEXIAM_API_PORT:-8000}}
      HEXIAM_PDP_URL: ${HEXIAM_INTERNAL_URL:-http://hexiam:8000}

  hexiam:
    build:
      context: ./.hexiam/hexalgon-iam-system
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ./.hexiam/hexalgon-iam-system/.env.bundle
    depends_on:
      hexiam-postgres:
        condition: service_healthy
      hexiam-redis:
        condition: service_healthy
    ports:
      - "${HEXIAM_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  hexiam-admin:
    build:
      context: ./.hexiam/hexalgon-iam-system/admin-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.hexiam/hexalgon-iam-system/.env.bundle
    environment:
      VITE_API_PROXY_TARGET: ${HEXIAM_ADMIN_PROXY_TARGET:-http://hexiam:8000}
    ports:
      - "${HEXIAM_ADMIN_PORT:-5173}:5173"
    depends_on:
      hexiam:
        condition: service_started

  hexiam-postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./.hexiam/hexalgon-iam-system/.env.bundle
    environment:
      POSTGRES_USER: postgres
    expose:
      - "5432"
    volumes:
      - hexiam_postgres_data:/var/lib/postgresql/data
      - ./.hexiam/hexalgon-iam-system/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hexiam-redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./.hexiam/hexalgon-iam-system/.env.bundle
    command: ["redis-server", "--aclfile", "/data/users.acl"]
    expose:
      - "6379"
    volumes:
      - hexiam_redis_data:/data
      - ./.hexiam/hexalgon-iam-system/users.acl:/data/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hexiam_postgres_data:
  hexiam_redis_data:
