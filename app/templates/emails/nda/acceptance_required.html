<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h2 { color: #2c3e50; }
        .button { background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .deadline { color: #d9534f; font-weight: bold; }
        .footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Action Required: Please Accept {{ title }}</h2>
        <p>Hello {{ recipient_name }},</p>
        <p>You are required to accept the following NDA: <strong>{{ title }}</strong></p>
        <p><strong class="deadline">Deadline: {{ deadline }}</strong></p>
        <p><a href="{{ acceptance_link }}" class="button">Accept NDA</a></p>
        <p>If you have questions, please contact your administrator.</p>
        <div class="footer">
            <p>HexShare Document Management</p>
        </div>
    </div>
</body>
</html>
